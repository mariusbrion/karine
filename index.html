<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La boîte à outils de Karine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #FAFAF9;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .title-font { font-family: 'DM Serif Display', serif; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── Grid layout ── */
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 16px;
      transition: grid-template-columns 0.45s cubic-bezier(0.4,0,0.2,1);
    }

    .tools-grid.expanded-1, .tools-grid.expanded-2 {
      grid-template-columns: 1fr;
    }

    /* ── Cards ── */
    .slot-card {
      background: #ffffff;
      border: 1px solid #E8E8E5;
      border-radius: 16px;
      transition: box-shadow 0.25s ease, transform 0.25s ease,
                  border-color 0.25s ease, min-height 0.45s cubic-bezier(0.4,0,0.2,1);
      position: relative;
      overflow: hidden;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    .slot-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.07);
      transform: translateY(-2px);
      border-color: #D0D0CC;
    }

    /* Expanded state */
    .slot-card.expanded {
      min-height: 520px;
      cursor: default;
      transform: none;
      box-shadow: 0 12px 48px rgba(0,0,0,0.09);
      border-color: #D8D8D4;
      align-items: stretch;
      justify-content: flex-start;
      padding: 0;
    }

    .slot-card.expanded:hover { transform: none; }

    /* Hidden slots when grid is expanded */
    .tools-grid.expanded-1 #slot2, .tools-grid.expanded-1 #slot3, .tools-grid.expanded-1 #slot4 { display: none; }
    .tools-grid.expanded-2 #slot1, .tools-grid.expanded-2 #slot3, .tools-grid.expanded-2 #slot4 { display: none; }

    .slot-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 60%);
      pointer-events: none;
    }

    .slot-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #F2F2EF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .slot-card:hover .slot-icon { background: #EAEAE6; transform: scale(1.05); }

    .slot-label {
      font-size: 0.8125rem;
      font-weight: 400;
      color: #888882;
      letter-spacing: 0.01em;
      text-align: center;
      padding: 0 16px;
    }

    /* ── Inside panels ── */
    .expanded-panel {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.3s ease 0.2s;
    }

    .expanded-panel.visible {
      display: flex;
      opacity: 1;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;
      border-bottom: 1px solid #F0F0EC;
    }

    .panel-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.125rem;
      color: #1a1a1a;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #F4F4F1;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      position: relative;
      z-index: 10;
    }

    .close-btn:hover { background: #EAEAE6; }
    .panel-content { flex: 1; padding: 24px; overflow-y: auto; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim-1 { animation: fadeUp 0.55s ease both; }
    .anim-2 { animation: fadeUp 0.55s 0.08s ease both; }
    .anim-3 { animation: fadeUp 0.55s 0.16s ease both; }
    .anim-4 { animation: fadeUp 0.55s 0.22s ease both; }
    .anim-5 { animation: fadeUp 0.55s 0.30s ease both; }

    .divider { width: 32px; height: 1px; background: #E0E0DC; margin: 0 auto; }
    .badge {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #B8B8B0;
    }

    .slot-default { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  </style>
</head>
<body class="relative">

  <div class="relative z-10 max-w-3xl mx-auto px-6 py-20">

    <header class="text-center mb-16 anim-1">
      <p class="badge mb-5">Espace personnel</p>
      <h1 class="title-font text-4xl md:text-5xl font-normal text-gray-900 leading-tight mb-4">
        La boîte à outils<br><em>de Karine</em>
      </h1>
      <div class="divider mt-6"></div>
    </header>

    <div class="tools-grid" id="toolsGrid">

      <div class="slot-card anim-2" id="slot1" onclick="openSlot1(event)">
        <div class="slot-default" id="slot1-default">
          <div class="slot-icon">📂</div>
          <span class="slot-label">J'ai un fichier<br>à déposer</span>
        </div>
        <div id="upload-panel" class="expanded-panel">
          <div class="panel-header">
            <span class="panel-title">Déposer un fichier</span>
            <button class="close-btn" onclick="closeSlot1(event)" title="Fermer">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round">
                <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
              </svg>
            </button>
          </div>
          <div id="upload-content" class="panel-content"></div>
        </div>
      </div>

      <div class="slot-card anim-3" id="slot2" onclick="openSlot2(event)">
        <div class="slot-default" id="slot2-default">
          <div class="slot-icon">📍</div>
          <span class="slot-label">Géocoder un CSV<br>(Adresses → Coordonnées)</span>
        </div>
        <div id="geocodeur-panel" class="expanded-panel">
          <div class="panel-header">
            <span class="panel-title">Géocodeur national (BAN)</span>
            <button class="close-btn" onclick="closeSlot2(event)" title="Fermer">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round">
                <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
              </svg>
            </button>
          </div>
          <div id="geocodeur-content" class="panel-content"></div>
        </div>
      </div>

<div class="slot-card anim-4" id="slot3" onclick="openSlot3(event)">
  <div class="slot-default" id="slot3-default">
    <div class="slot-icon">⏳</div>
    <span class="slot-label">Calculer des isochrones<br>(Zones d'accessibilité)</span>
  </div>
  <div id="iso-panel" class="expanded-panel">
    <div class="panel-header">
      <span class="panel-title">Générateur d'isochrones (OpenRouteService)</span>
      <button class="close-btn" onclick="closeSlot3(event)" title="Fermer">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round">
          <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
        </svg>
      </button>
    </div>
    <div id="iso-content" class="panel-content"></div>
  </div>
</div>

      <div class="slot-card anim-5" id="slot4">
        <div class="slot-default">
          <div class="slot-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9E98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/>
            </svg>
          </div>
          <span class="slot-label">Outil 4</span>
        </div>
      </div>

    </div>

    <footer class="text-center mt-20 anim-5">
      <p class="text-xs text-gray-300 tracking-wide">✦</p>
    </footer>

  </div>

  <script>
    let slot1Open = false;
    let slot2Open = false;
    let slot3Open = false;

function openSlot3(e) {
  if (slot1Open || slot2Open || slot3Open) return;
  slot3Open = true;
  const grid = document.getElementById('toolsGrid');
  const card = document.getElementById('slot3');
  const def = document.getElementById('slot3-default');
  const panel = document.getElementById('iso-panel');
  grid.classList.add('expanded-1'); // Utilise la même classe d'expansion pleine largeur
  card.classList.add('expanded');
  def.style.display = 'none';

  if (!document.getElementById('iso-js')) {
    const script = document.createElement('script');
    script.id = 'iso-js';
    script.src = 'outils/iso.js';
    document.body.appendChild(script);
  } else if (typeof initIso === 'function') {
    initIso();
  }
  panel.style.display = 'flex';
  requestAnimationFrame(() => panel.classList.add('visible'));
}

function closeSlot3(e) {
  e.stopPropagation();
  slot3Open = false;
  const grid = document.getElementById('toolsGrid');
  const card = document.getElementById('slot3');
  const def = document.getElementById('slot3-default');
  const panel = document.getElementById('iso-panel');
  panel.classList.remove('visible');
  setTimeout(() => {
    panel.style.display = 'none';
    grid.classList.remove('expanded-1');
    card.classList.remove('expanded');
    def.style.display = 'flex';
  }, 320);
}

    function openSlot1(e) {
      if (slot1Open || slot2Open) return;
      slot1Open = true;
      const grid = document.getElementById('toolsGrid');
      const card = document.getElementById('slot1');
      const def = document.getElementById('slot1-default');
      const panel = document.getElementById('upload-panel');
      grid.classList.add('expanded-1');
      card.classList.add('expanded');
      def.style.display = 'none';

      if (!document.getElementById('upload-js')) {
        const script = document.createElement('script');
        script.id = 'upload-js';
        script.src = 'outils/upload.js';
        document.body.appendChild(script);
      } else if (typeof initUpload === 'function') {
        initUpload();
      }
      panel.style.display = 'flex';
      requestAnimationFrame(() => panel.classList.add('visible'));
    }

    function closeSlot1(e) {
      e.stopPropagation();
      slot1Open = false;
      const grid = document.getElementById('toolsGrid');
      const card = document.getElementById('slot1');
      const def = document.getElementById('slot1-default');
      const panel = document.getElementById('upload-panel');
      panel.classList.remove('visible');
      setTimeout(() => {
        panel.style.display = 'none';
        grid.classList.remove('expanded-1');
        card.classList.remove('expanded');
        def.style.display = 'flex';
      }, 320);
    }

    function openSlot2(e) {
      if (slot1Open || slot2Open) return;
      slot2Open = true;
      const grid = document.getElementById('toolsGrid');
      const card = document.getElementById('slot2');
      const def = document.getElementById('slot2-default');
      const panel = document.getElementById('geocodeur-panel');
      grid.classList.add('expanded-2');
      card.classList.add('expanded');
      def.style.display = 'none';

      if (!document.getElementById('geocodeur-js')) {
        const script = document.createElement('script');
        script.id = 'geocodeur-js';
        script.src = 'outils/geocodeur.js';
        document.body.appendChild(script);
      } else if (typeof initGeocodeur === 'function') {
        initGeocodeur();
      }
      panel.style.display = 'flex';
      requestAnimationFrame(() => panel.classList.add('visible'));
    }

    function closeSlot2(e) {
      e.stopPropagation();
      slot2Open = false;
      const grid = document.getElementById('toolsGrid');
      const card = document.getElementById('slot2');
      const def = document.getElementById('slot2-default');
      const panel = document.getElementById('geocodeur-panel');
      panel.classList.remove('visible');
      setTimeout(() => {
        panel.style.display = 'none';
        grid.classList.remove('expanded-2');
        card.classList.remove('expanded');
        def.style.display = 'flex';
      }, 320);
    }
  </script>
</body>
</html>
