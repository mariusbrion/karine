<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La boîte à outils de Karine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #FAFAF9;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .title-font {
      font-family: 'DM Serif Display', serif;
    }

    /* Subtle grain texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .slot-card {
      background: #ffffff;
      border: 1px solid #E8E8E5;
      border-radius: 16px;
      transition: box-shadow 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
      position: relative;
      overflow: hidden;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    .slot-card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.07);
      transform: translateY(-2px);
      border-color: #D0D0CC;
    }

    .slot-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 60%);
      pointer-events: none;
    }

    .slot-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #F2F2EF;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .slot-card:hover .slot-icon {
      background: #EAEAE6;
    }

    .slot-label {
      font-size: 0.8125rem;
      font-weight: 400;
      color: #B0B0A8;
      letter-spacing: 0.02em;
    }

    /* Page load animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim-1 { animation: fadeUp 0.55s ease both; }
    .anim-2 { animation: fadeUp 0.55s 0.08s ease both; }
    .anim-3 { animation: fadeUp 0.55s 0.16s ease both; }
    .anim-4 { animation: fadeUp 0.55s 0.22s ease both; }
    .anim-5 { animation: fadeUp 0.55s 0.30s ease both; }

    .divider {
      width: 32px;
      height: 1px;
      background: #E0E0DC;
      margin: 0 auto;
    }

    .badge {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #B8B8B0;
    }
  </style>
</head>
<body class="relative">

  <div class="relative z-10 max-w-2xl mx-auto px-6 py-20">

    <!-- Header -->
    <header class="text-center mb-16 anim-1">
      <p class="badge mb-5">Espace personnel</p>
      <h1 class="title-font text-4xl md:text-5xl font-normal text-gray-900 leading-tight mb-4">
        La boîte à outils<br><em>de Karine</em>
      </h1>
      <div class="divider mt-6"></div>
    </header>

    <!-- Grid 2x2 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <!-- Slot 1 -->
      <div class="slot-card p-8 anim-2">
        <div class="slot-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9E98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
        </div>
        <span class="slot-label">Outil 1</span>
      </div>

      <!-- Slot 2 -->
      <div class="slot-card p-8 anim-3">
        <div class="slot-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9E98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
        </div>
        <span class="slot-label">Outil 2</span>
      </div>

      <!-- Slot 3 -->
      <div class="slot-card p-8 anim-4">
        <div class="slot-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9E98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
        </div>
        <span class="slot-label">Outil 3</span>
      </div>

      <!-- Slot 4 -->
      <div class="slot-card p-8 anim-5">
        <div class="slot-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9E98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
        </div>
        <span class="slot-label">Outil 4</span>
      </div>

    </div>

    <!-- Footer -->
    <footer class="text-center mt-20 anim-5">
      <p class="text-xs text-gray-300 tracking-wide">✦</p>
    </footer>

  </div>

</body>
</html>
